name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PLUGIN_VERSION: 0.3.${{ github.run_number }}.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        shell: pwsh
        run: |
          $dev = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          Expand-Archive -Force dalamud.zip $dev
          "DALAMUD_HOME=$dev" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build (version is bumped automatically on every build)
        run: dotnet build NaviFantasy/NaviFantasy.csproj -c Release -p:Version=${{ env.PLUGIN_VERSION }}

      - name: Find plugin package
        id: pkg
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path NaviFantasy -Recurse -Filter latest.zip | Select-Object -First 1
          if (-not $zip) { throw "latest.zip was not produced by the build" }
          "path=$($zip.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Generate repo.json with the new version
        id: repo
        shell: pwsh
        run: |
          $entries = @(Get-Content repo.json -Raw | ConvertFrom-Json)
          $entries[0].AssemblyVersion = "${{ env.PLUGIN_VERSION }}"
          $entries[0].LastUpdate = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $out = Join-Path $env:RUNNER_TEMP "repo.json"
          ConvertTo-Json -InputObject $entries -Depth 6 | Set-Content -Path $out -Encoding utf8
          Get-Content $out
          "path=$out" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish release "latest"
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          gh release delete latest --cleanup-tag --yes
          $global:LASTEXITCODE = 0
          gh release create latest "${{ steps.pkg.outputs.path }}" "${{ steps.repo.outputs.path }}" --title "Latest build (${{ env.PLUGIN_VERSION }})" --notes "Automatic build ${{ env.PLUGIN_VERSION }} of the newest commit on main." --target ${{ github.sha }}
